{% extends "base.html" %}
{% block title %}옮긴 파일 — {{ e.name }}{% endblock %}
{% block content %}
<section class="card">
  <h2>{{ e.name }}</h2>
  {% if batch %}
  <p>정리 작업으로 이동한 파일입니다. 이동 위치: <span class="path">{{ dst }}</span></p>
  <div class="row"><a class="btn primary" href="/s3?batch={{ batch }}">작업 기록·되돌리기</a><a class="btn" href="{{ back }}">목록으로 돌아가기</a></div>
  {% else %}
  <p>분석할 때의 위치(<span class="path">{{ e.display }}</span>)에 파일이 없습니다. 직접 옮겼거나 지웠을 수 있습니다.</p>
  <div class="row"><a class="btn" href="{{ back }}">목록으로 돌아가기</a><a class="btn" href="/s3">작업 기록</a></div>
  {% endif %}
</section>
{% endblock %}
